services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: price_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_tracker -d price_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PT_DATABASE_URL: postgresql+asyncpg://price_tracker:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/price_tracker
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - tracker_data:/data

volumes:
  pg_data:
  tracker_data:
